[project]
name = "fihg"
version = "0.1.0"
description = "First-Class Interhypergraph Grid - Modular synth architecture"
requires-python = ">=3.11"
dependencies = [
    "gremlinpython>=3.7.0",
    "pydantic>=2.0",
    "aiosqlite>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]